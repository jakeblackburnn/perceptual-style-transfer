<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style Transfer</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <h1>Style Transfer</h1>
        <p class="local-note">Running locally. Images are processed on this computer and are not sent anywhere else.</p>

        <div class="upload-section">
            <div class="upload-box">
                <h3>Content Image</h3>
                <input type="file" id="contentImage" accept="image/*">
                <div id="contentPreview" class="preview"></div>
            </div>
        </div>

        <div class="model-section">
            <h3>Select Style Model</h3>
            <select id="modelSelect" class="model-select">
                <option value="">Loading models...</option>
            </select>
        </div>

        <button id="transferBtn" class="transfer-btn" disabled>Apply Style Transfer</button>

        <div id="loading" class="loading" style="display: none;">Processing...</div>

        <div id="resultSection" class="result-section" style="display: none;">
            <h3>Result</h3>
            <div id="resultPreview" class="preview"></div>
            <button id="downloadBtn" class="download-btn">Download Image</button>
        </div>

        <div id="error" class="error" style="display: none;"></div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
